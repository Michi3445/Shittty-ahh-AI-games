<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b22;--txt:#cfd0ff;--c1:#3df2ff;--c2:#ff4fd8;--c3:#ffe14d;--c4:#5dff7a;--c5:#ff9a3d;--c6:#ff5b5b;--c7:#7b93ff;--d:#4d4d85;--acc:#ff9a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e6f7;--txt:#2a2650}}
:root[data-theme="light"]{--bg:#e9e6f7;--txt:#2a2650}
:root[data-theme="dark"]{--bg:#0d0b22;--txt:#cfd0ff}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:'VT323','Courier New',monospace;font-size:22px;display:flex;flex-direction:column;align-items:center;padding:18px 12px 28px;box-sizing:border-box}
h1{font-weight:400;font-size:clamp(34px,9vw,60px);margin:0;letter-spacing:.1em}
.sub{margin:0 0 14px;opacity:.75;text-align:center}
nav{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;touch-action:manipulation;user-select:none;border-radius:8px}
.tab{color:var(--a);background:none;border:2px solid var(--a);padding:2px 18px}
.tab[aria-pressed="true"]{background:var(--a);color:#0d0b22;box-shadow:0 0 14px var(--a)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cab{background:#05040f;border:3px solid var(--acc);border-radius:16px;padding:14px;box-shadow:0 0 28px color-mix(in srgb,var(--acc) 60%,transparent),inset 0 0 18px color-mix(in srgb,var(--acc) 25%,transparent);max-width:100%;box-sizing:border-box}
pre{margin:0;line-height:1.05;font-family:inherit;font-size:20px;width:max-content;color:#cfd0ff}
i{font-style:normal}.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}.c6{color:var(--c6)}.c7{color:var(--c7)}.d{color:var(--d)}
[hidden]{display:none!important}
#cv{display:block;width:min(92vw,860px);image-rendering:pixelated;border-radius:6px}
#help{margin:16px 0 0;text-align:center;max-width:62ch;line-height:1.3}
kbd{font:inherit;border:1px solid var(--acc);color:var(--acc);border-radius:5px;padding:0 6px;margin:0 1px}
.pad{display:none;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
@media (hover:none),(pointer:coarse){.pad{display:flex}}
.pad button{padding:8px 18px;background:#1a1640;color:var(--c1);border:2px solid var(--c1)}
</style>
</head>
<body>
<h1 id="ttl">ASCII ARCADE</h1>
<p class="sub">Fuenf Spiele, gebaut fuer den Browser.</p>
<nav id="tabs">
<button class="tab" data-g="doom" style="--a:#ff9a3d">DOOM</button>
<button class="tab" data-g="pong" style="--a:#3df2ff">PONG</button>
<button class="tab" data-g="tetris" style="--a:#ff4fd8">TETRIS</button>
<button class="tab" data-g="pacman" style="--a:#ffe14d">PACMAN</button>
<button class="tab" data-g="night" style="--a:#ff4d4d">NACHTSCHICHT</button>
</nav>
<div class="cab"><canvas id="cv" width="320" height="200"></canvas><pre id="scr" aria-label="Spielfeld" hidden></pre></div>
<p id="help"></p>
<div class="pad">
<button data-k="ArrowLeft">&lt;</button><button data-k="ArrowUp">^</button><button data-k="ArrowDown">v</button><button data-k="ArrowRight">&gt;</button>
<button data-k="q">LICHT L</button><button data-k="e">LICHT R</button><button data-k=" ">AKTION</button><button data-k="Enter">NEU</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scr=document.getElementById('scr'),cv=document.getElementById('cv'),help=document.getElementById('help'),cx=cv.getContext('2d');
document.getElementById('ttl').innerHTML=[...'ASCII ARCADE'].map((c,i)=>`<span style="color:var(--c${i%7+1})">${c}</span>`).join('');
const keys={},alias={w:'ArrowUp',s:'ArrowDown',a:'ArrowLeft',d:'ArrowRight'};
let cur,timer;
function press(k){keys[k]=1;cur&&cur.key&&cur.key(k)}
addEventListener('keydown',e=>{const k=alias[e.key.toLowerCase()]||e.key;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
 if(!(e.repeat&&k===' '))press(k)});
addEventListener('keyup',e=>{keys[alias[e.key.toLowerCase()]||e.key]=0});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>{keys[k]=0}))});
const I=(c,s)=>`<i class="${c}">${s}</i>`;
function fit(){if(scr.hidden)return;scr.style.fontSize='20px';const av=Math.min(innerWidth-24,900)-34,w=scr.getBoundingClientRect().width;if(w>av)scr.style.fontSize=(20*av/w).toFixed(2)+'px'}
addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);
const G={};

/* ---------- PONG ---------- */
G.pong={canvas:1,smooth:1,w:560,h:400,cw:'min(92vw,760px)',fps:60,acc:'#3df2ff',help:'<kbd>W</kbd><kbd>S</kbd> oder <kbd>Pfeile</kbd> bewegen. Wer zuerst 7 hat, gewinnt. <kbd>Enter</kbd> = Neustart.',
init(){this.p=200;this.a=200;this.s=[0,0];this.over=0;this.serve(1)},
serve(d){this.bx=280;this.by=200;this.sp=4.5;this.tr=[];const an=(Math.random()-.5)*.8;this.vx=Math.cos(an)*this.sp*d;this.vy=Math.sin(an)*this.sp},
key(k){if(k==='Enter')this.init()},
tick(){if(this.over)return;
 if(keys.ArrowUp)this.p-=5.5;if(keys.ArrowDown)this.p+=5.5;this.p=Math.max(45,Math.min(355,this.p));
 this.a+=Math.max(-3.6,Math.min(3.6,this.by-this.a));this.a=Math.max(45,Math.min(355,this.a));
 this.tr.unshift([this.bx,this.by]);if(this.tr.length>10)this.tr.pop();
 this.bx+=this.vx;this.by+=this.vy;
 if(this.by<9){this.by=9;this.vy=Math.abs(this.vy)}if(this.by>391){this.by=391;this.vy=-Math.abs(this.vy)}
 const bounce=(py,dir)=>{this.sp=Math.min(9,this.sp+.35);const an=Math.max(-1,Math.min(1,(this.by-py)/45))*.95;this.vx=Math.cos(an)*this.sp*dir;this.vy=Math.sin(an)*this.sp};
 if(this.vx<0&&this.bx-9<=30&&this.bx>16&&Math.abs(this.by-this.p)<=50){this.bx=39;bounce(this.p,1)}
 if(this.vx>0&&this.bx+9>=530&&this.bx<544&&Math.abs(this.by-this.a)<=50){this.bx=521;bounce(this.a,-1)}
 if(this.bx<-20){this.s[1]++;this.serve(1)}if(this.bx>580){this.s[0]++;this.serve(-1)}
 if(this.s[0]>6||this.s[1]>6)this.over=1},
draw(){const c=cx,W=560,H=400,PI=Math.PI,X=v=>v,Y=v=>v;
 c.shadowBlur=0;c.textAlign='left';const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#071a2b');bg.addColorStop(1,'#12072b');c.fillStyle=bg;c.fillRect(0,0,W,H);
 c.strokeStyle='#2a4a78';c.lineWidth=4;c.strokeRect(2,2,W-4,H-4);
 c.setLineDash([12,14]);c.beginPath();c.moveTo(W/2,8);c.lineTo(W/2,H-8);c.stroke();c.setLineDash([]);
 c.font='80px VT323,monospace';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#3df2ff';c.fillText(this.s[0],W/2-70,50);c.fillStyle='#ff4fd8';c.fillText(this.s[1],W/2+70,50);
 const pd=(x,py,col)=>{c.fillStyle=col;c.shadowColor=col;c.shadowBlur=18;c.beginPath();c.roundRect(x-6,py-45,12,90,6);c.fill()};
 pd(24,this.p,'#3df2ff');pd(536,this.a,'#ff4fd8');
 this.tr.forEach(([x,y],i)=>{c.globalAlpha=.4*(1-i/9);c.fillStyle='#ffe14d';c.shadowBlur=0;c.beginPath();c.arc(X(x),Y(y),9*(1-i/12),0,2*PI);c.fill()});
 c.globalAlpha=1;c.fillStyle='#fff6b0';c.shadowColor='#ffe14d';c.shadowBlur=20;c.beginPath();c.arc(X(this.bx),Y(this.by),9,0,2*PI);c.fill();c.shadowBlur=0;
 if(this.over){c.fillStyle='rgba(5,4,25,.72)';c.fillRect(0,0,W,H);const w=this.s[0]>6;c.font='60px VT323,monospace';c.fillStyle=w?'#5dff7a':'#ff5b5b';c.fillText(w?'DU GEWINNST!':'CPU GEWINNT',W/2,H/2-10);c.font='26px VT323,monospace';c.fillStyle='#fff';c.fillText('Enter = nochmal',W/2,H/2+34)}
 c.textAlign='left'}};

/* ---------- TETRIS ---------- */
G.tetris={canvas:1,smooth:1,w:470,h:560,cw:'min(92vw,380px)',fps:30,acc:'#ff4fd8',help:'<kbd>&larr;</kbd><kbd>&rarr;</kbd> bewegen, <kbd>&uarr;</kbd> drehen, <kbd>&darr;</kbd> schneller, <kbd>Leertaste</kbd> fallen lassen. <kbd>Enter</kbd> = Neustart.',
P:{I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},
col:{I:'c1',O:'c3',T:'c2',S:'c4',Z:'c6',J:'c7',L:'c5'},
init(){this.b=Array.from({length:20},()=>Array(10).fill(0));this.sc=0;this.ln=0;this.over=0;this.t=0;this.n=this.rnd();this.spawn()},
rnd(){return 'IOTSZJL'[Math.random()*7|0]},
spawn(){this.k=this.n;this.m=this.P[this.k];this.n=this.rnd();this.x=(10-this.m[0].length)/2|0;this.y=0;if(this.hit(this.m,this.x,this.y))this.over=1},
hit(m,x,y){return m.some((r,j)=>r.some((v,i)=>v&&(x+i<0||x+i>9||y+j>19||this.b[y+j][x+i])))},
rot(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())},
lock(){this.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)this.b[this.y+j][this.x+i]=this.k}));
 let c=0;this.b=this.b.filter(r=>{if(r.every(v=>v)){c++;return false}return true});
 while(this.b.length<20)this.b.unshift(Array(10).fill(0));
 this.ln+=c;this.sc+=[0,100,300,500,800][c];this.spawn()},
key(k){if(k==='Enter'){this.init();return}if(this.over)return;
 if(k==='ArrowLeft'&&!this.hit(this.m,this.x-1,this.y))this.x--;
 if(k==='ArrowRight'&&!this.hit(this.m,this.x+1,this.y))this.x++;
 if(k==='ArrowDown'&&!this.hit(this.m,this.x,this.y+1))this.y++;
 if(k==='ArrowUp'){const r=this.rot(this.m);if(!this.hit(r,this.x,this.y))this.m=r}
 if(k===' '){while(!this.hit(this.m,this.x,this.y+1))this.y++;this.lock()}},
tick(){if(this.over)return;if(++this.t>=Math.max(4,18-(this.ln/5|0))){this.t=0;if(this.hit(this.m,this.x,this.y+1))this.lock();else this.y++}},
draw(){const c=cx,S=28,COL={I:'#3df2ff',O:'#ffe14d',T:'#ff4fd8',S:'#5dff7a',Z:'#ff5b5b',J:'#6c8cff',L:'#ff9a3d'};
 c.shadowBlur=0;c.textAlign='left';c.textBaseline='alphabetic';
 const bg=c.createLinearGradient(0,0,0,560);bg.addColorStop(0,'#0e0830');bg.addColorStop(1,'#05040f');c.fillStyle=bg;c.fillRect(0,0,470,560);
 c.fillStyle='#090920';c.fillRect(0,0,280,560);
 c.strokeStyle='#1a1a3c';c.lineWidth=1;c.beginPath();for(let i=0;i<=10;i++){c.moveTo(i*S,0);c.lineTo(i*S,560)}for(let j=0;j<=20;j++){c.moveTo(0,j*S);c.lineTo(280,j*S)}c.stroke();
 const blk=(x,y,k,a)=>{c.globalAlpha=a;c.fillStyle=COL[k];c.shadowColor=COL[k];c.shadowBlur=8;c.fillRect(x+1,y+1,S-2,S-2);c.shadowBlur=0;
  c.fillStyle='rgba(255,255,255,.45)';c.fillRect(x+1,y+1,S-2,4);c.fillRect(x+1,y+1,4,S-2);c.fillStyle='rgba(0,0,0,.35)';c.fillRect(x+1,y+S-5,S-2,4);c.fillRect(x+S-5,y+1,4,S-2);c.globalAlpha=1};
 this.b.forEach((r,y)=>r.forEach((k,x)=>{if(k)blk(x*S,y*S,k,1)}));
 if(!this.over){let gy=this.y;while(!this.hit(this.m,this.x,gy+1))gy++;
  this.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)blk((this.x+i)*S,(gy+j)*S,this.k,.22)}));
  this.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)blk((this.x+i)*S,(this.y+j)*S,this.k,1)}))}
 c.strokeStyle='#ff4fd8';c.lineWidth=3;c.shadowColor='#ff4fd8';c.shadowBlur=12;c.strokeRect(1.5,1.5,277,557);c.shadowBlur=0;
 const lab=(t,y,col)=>{c.font='28px VT323,monospace';c.fillStyle=col;c.fillText(t,300,y)},val=(t,y)=>{c.font='44px VT323,monospace';c.fillStyle='#fff';c.fillText(t,300,y)};
 lab('PUNKTE',50,'#ffe14d');val(this.sc,92);lab('LINIEN',150,'#3df2ff');val(this.ln,192);lab('LEVEL',250,'#5dff7a');val(1+(this.ln/5|0),292);lab('NAECHSTER',350,'#ff4fd8');
 this.P[this.n].forEach((r,j)=>r.forEach((v,i)=>{if(v)blk(300+i*S,372+j*S,this.n,1)}));
 if(this.over){c.fillStyle='rgba(5,4,25,.78)';c.fillRect(0,0,280,560);c.textAlign='center';c.font='54px VT323,monospace';c.fillStyle='#ff5b5b';c.fillText('GAME OVER',140,270);c.font='26px VT323,monospace';c.fillStyle='#fff';c.fillText('Enter = nochmal',140,306);c.textAlign='left'}}};

/* ---------- DOOM (Raycaster mit Texturen) ---------- */
const DW=320,DH=200,img=cx.createImageData(DW,DH),buf=new Uint32Array(img.data.buffer);
const rgb=(r,g,b)=>(255<<24)|((b&255)<<16)|((g&255)<<8)|(r&255);
const TEX=[0,1].map(t=>{const a=new Uint8Array(64*64*3);
 for(let y=0;y<64;y++)for(let x=0;x<64;x++){const n=((x*7919+y*104729)^(x*y))&15,i=(y*64+x)*3;let c;
  if(!t){const bx=(x+((y>>4)&1)*16)%32;c=(y%16<2||bx<2)?[60,52,48]:[150+n,58+n/2,42]}
  else{const e=x%32<2||y%32<2;c=e?[30,38,48]:(x%32>3&&x%32<6&&y%32>3&&y%32<6)?[170,190,210]:(y%32>26&&y%32<29)?[60,200+n,120]:[78+n,92+n,118+n]}
  a[i]=c[0];a[i+1]=c[1];a[i+2]=c[2]}return a});
function imp(u,v,h,f){let r,g,b;const d=(a,c,q)=>(u-a)**2+(v-c)**2<q*q;
 if(d(.43,.18,.03)||d(.57,.18,.03)){r=255;g=230;b=60}
 else if(d(.5,.2,.15)){r=205;g=72;b=46}
 else if(((u-.5)/.23)**2+((v-.58)/.28)**2<1){r=165;g=56;b=36}
 else if(v>.3&&v<.66&&((u>.2&&u<.3)||(u>.7&&u<.8))){r=135;g=45;b=30}
 else if(v>.82&&((u>.34&&u<.46)||(u>.54&&u<.66))){r=110;g=35;b=25}
 else if(v<.1&&((u>.36&&u<.42)||(u>.58&&u<.64))){r=235;g=225;b=190}
 else return 0;
 if(h){r=g=b=255}return rgb(r*f,g*f,b*f)}
const CEIL=[],FLOOR=[];for(let y=0;y<DH/2;y++){const t=y/(DH/2);CEIL[y]=rgb(14+30*t,12+22*t,40+50*t);const u=1-t;FLOOR[DH/2+y]=rgb(30+70*(1-u),26+50*(1-u),34+40*(1-u))}
G.doom={canvas:1,fps:30,acc:'#ff9a3d',help:'<kbd>W</kbd><kbd>S</kbd> laufen, <kbd>A</kbd><kbd>D</kbd> drehen, <kbd>Leertaste</kbd> schiessen. Rechts oben ist die Karte. <kbd>Enter</kbd> = Neustart.',
M:['################','#..............#','#.####....####.#','#.#..........#.#','#.#..######..#.#','#....#....#....#','#....#....#....#','#.#..###..##.#.#','#.#..........#.#','#.####....####.#','#......##......#','#..##......##..#','#..##..##..##..#','#......##......#','#..............#','################'].map((r,y)=>[...r].map((c,x)=>c==='.'?0:(x%15&&y%15)?2:1)),
init(){this.x=1.5;this.y=1.5;this.a=.8;this.hp=100;this.kills=0;this.cd=0;this.fl=0;this.dmg=0;this.n=0;this.en=[];this.zb=[];for(let i=0;i<3;i++)this.spawn()},
spawn(){for(let t=0;t<40;t++){const x=1+Math.random()*14,y=1+Math.random()*14;if(!this.M[y|0][x|0]&&Math.hypot(x-this.x,y-this.y)>6){this.en.push({x,y,hp:3,cd:0,hurt:0});return}}},
key(k){if(k==='Enter')this.init()},
tick(){if(this.hp<=0)return;
 if(keys.ArrowLeft)this.a-=.07;if(keys.ArrowRight)this.a+=.07;
 const d=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);
 if(d){const nx=this.x+Math.cos(this.a)*.1*d,ny=this.y+Math.sin(this.a)*.1*d;
  if(!this.M[this.y|0][nx|0])this.x=nx;if(!this.M[ny|0][this.x|0])this.y=ny}
 if(keys[' ']&&this.cd<=0)this.fire();
 this.cd--;if(this.fl>0)this.fl--;if(this.dmg>0)this.dmg--;
 for(const e of this.en){const dx=this.x-e.x,dy=this.y-e.y,dd=Math.hypot(dx,dy);
  if(dd>1.1){const nx=e.x+dx/dd*.035,ny=e.y+dy/dd*.035;if(!this.M[e.y|0][nx|0])e.x=nx;if(!this.M[ny|0][e.x|0])e.y=ny}
  else if(e.cd<=0){this.hp-=7;e.cd=30;this.dmg=6}
  e.cd--;e.hurt--}
 if(++this.n%150===0&&this.en.length<5)this.spawn()},
fire(){this.cd=9;this.fl=3;let best=null;
 for(const e of this.en)if(e.ty>0&&Math.abs(e.tx/e.ty)<.2&&e.ty<this.zb[DW/2|0]&&(!best||e.ty<best.ty))best=e;
 if(best){best.hp--;best.hurt=4;if(best.hp<=0){this.en.splice(this.en.indexOf(best),1);this.kills++;this.spawn()}}},
draw(){const X=this.x,Y=this.y,dx=Math.cos(this.a),dy=Math.sin(this.a),plx=-dy*.66,ply=dx*.66,zb=this.zb;
 for(let y=0;y<DH;y++)buf.fill(y<DH/2?CEIL[y]:FLOOR[y],y*DW,(y+1)*DW);
 for(let c=0;c<DW;c++){const cm=2*c/DW-1,rx=dx+plx*cm,ry=dy+ply*cm,ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
  let mx=X|0,my=Y|0,sx,sy,sdx,sdy,side=0,t;
  if(rx<0){sx=-1;sdx=(X-mx)*ddx}else{sx=1;sdx=(mx+1-X)*ddx}
  if(ry<0){sy=-1;sdy=(Y-my)*ddy}else{sy=1;sdy=(my+1-Y)*ddy}
  for(;;){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(t=this.M[my][mx])break}
  const dist=side?sdy-ddy:sdx-ddx;zb[c]=dist;
  const lh=DH/dist|0,top=(DH-lh)/2,y0=Math.max(0,top|0),y1=Math.min(DH,(top+lh)|0);
  let wx=side?X+dist*rx:Y+dist*ry;wx-=Math.floor(wx);let tx=wx*64|0;if((!side&&rx>0)||(side&&ry<0))tx=63-tx;
  const tex=TEX[t-1],fog=Math.max(.15,1-dist/11)*(side?.72:1);
  for(let y=y0;y<y1;y++){const i=((((y-top)*64/lh)&63)*64+tx)*3;buf[y*DW+c]=rgb(tex[i]*fog,tex[i+1]*fog,tex[i+2]*fog)}}
 const inv=1/(plx*dy-dx*ply);
 for(const e of this.en){const sx=e.x-X,sy=e.y-Y;e.tx=inv*(dy*sx-dx*sy);e.ty=inv*(-ply*sx+plx*sy)}
 for(const e of [...this.en].sort((a,b)=>b.ty-a.ty)){if(e.ty<.2)continue;
