G.pong={canvas:1,smooth:1,w:560,h:400,cw:'min(92vw,760px)',fps:60,acc:'#3df2ff',help:'<kbd>W</kbd><kbd>S</kbd> oder <kbd>Pfeile</kbd> bewegen. Schwierigkeit mit <kbd>1</kbd>-<kbd>4</kbd> waehlen. Wer zuerst 7 hat, gewinnt. <kbd>Enter</kbd> = Neustart.',

 for(let i=0;i<80;i++){c.fillStyle='rgba(255,255,255,'+(.15+Math.random()*.55).toFixed(2)+')';c.fillRect(Math.random()*560,Math.random()*400,1.5,1.5)}

 for(const s of[1,-1]){c.save();c.translate(0,200);c.scale(1,s);c.beginPath();for(let i=-14;i<=14;i++){c.moveTo(280+i*12,0);c.lineTo(280+i*62,200)}for(let j=1;j<10;j++){const y=Math.pow(j/9,2)*200;c.moveTo(0,y);c.lineTo(560,y)}c.stroke();c.restore()}
 c.strokeStyle='#2a6aa8';c.lineWidth=3;c.shadowColor='#3d9bff';c.shadowBlur=14;c.strokeRect(2,2,556,396);c.shadowBlur=0;

tick(){for(const q of this.pt){q.x+=q.vx;q.y+=q.vy;q.vy+=.06;q.l--}this.pt=this.pt.filter(q=>q.l>0);
 if(this.shake>0)this.shake*=.85;if(this.shake<.3)this.shake=0;this.fl[0]=Math.max(0,this.fl[0]-1);this.fl[1]=Math.max(0,this.fl[1]-1);

 c.fillStyle='#fff6b0';c.shadowColor='#ffd24d';c.shadowBlur=16;c.beginPath();c.arc(bx,by,9,0,2*PI);c.fill();c.shadowBlur=0;c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(bx-2.5,by-3,3,0,2*PI);c.fill();
 if(this.over){c.fillStyle='rgba(5,4,25,.72)';c.fillRect(0,0,W,H);const w=this.s[0]>6;c.font='60px VT323,monospace';c.fillStyle=w?'#5dff7a':'#ff5b5b';c.fillText(w?'DU GEWINNST!':'CPU GEWINNT',W/2,H/2-10);c.font='26px VT323,monospace';c.fillStyle='#fff';c.fillText('Enter = nochmal',W/2,H/2+34)}
 c.font='22px VT323,monospace';c.fillStyle='#6a86a8';c.fillText(this.LV[this.lv],W/2,H-16);c.restore()}};

/* ---------- TETRIS ---------- */
G.tetris={canvas:1,smooth:1,w:470,h:560,cw:'min(92vw,380px)',fps:30,acc:'#ff4fd8',help:'<kbd>&larr;</kbd><kbd>&rarr;</kbd> bewegen, <kbd>&uarr;</kbd> drehen, <kbd>&darr;</kbd> schneller, <kbd>Leertaste</kbd> fallen lassen. <kbd>Enter</kbd> = Neustart.',
P:{I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},
C:{I:'#3df2ff',O:'#ffe14d',T:'#ff4fd8',S:'#5dff7a',Z:'#ff5b5b',J:'#6c8cff',L:'#ff9a3d'},
init(){this.b=Array.from({length:20},()=>Array(10).fill(0));this.sc=0;this.ln=0;this.over=0;this.t=0;this.pt=[];this.fx=[];this.shake=0;if(!this.bgc)this.mkgfx();this.n=this.rnd();this.spawn()},
mkgfx(){const S=28,o=document.createElement('canvas');o.width=470;o.height=560;const c=o.getContext('2d');
 let g=c.createLinearGradient(0,0,470,560);g.addColorStop(0,'#12093e');g.addColorStop(.5,'#0a0620');g.addColorStop(1,'#1c0a3a');c.fillStyle=g;c.fillRect(0,0,470,560);
 for(let i=0;i<70;i++){c.fillStyle='rgba(255,255,255,'+(.1+Math.random()*.4).toFixed(2)+')';c.fillRect(280+Math.random()*190,Math.random()*560,1.5,1.5)}
 g=c.createLinearGradient(0,0,0,560);g.addColorStop(0,'#0e0e30');g.addColorStop(1,'#05051a');c.fillStyle=g;c.fillRect(0,0,280,560);
 c.strokeStyle='rgba(120,120,255,.1)';c.lineWidth=1;c.beginPath();for(let i=0;i<=10;i++){c.moveTo(i*S,0);c.lineTo(i*S,560)}for(let j=0;j<=20;j++){c.moveTo(0,j*S);c.lineTo(280,j*S)}c.stroke();
 const panel=(x,y,w,h)=>{c.fillStyle='rgba(255,255,255,.05)';c.strokeStyle='rgba(255,79,216,.45)';c.lineWidth=2;c.beginPath();c.roundRect(x,y,w,h,10);c.fill();c.stroke()};
 panel(290,14,170,100);panel(290,126,170,100);panel(290,238,170,90);panel(290,340,170,130);
 this.bgc=o;this.spr={};
 for(const k in this.C){const q=document.createElement('canvas');q.width=q.height=S;const d=q.getContext('2d');d.fillStyle=this.C[k];d.fillRect(1,1,S-2,S-2);
  const lg=d.createLinearGradient(0,0,S,S);lg.addColorStop(0,'rgba(255,255,255,.55)');lg.addColorStop(.5,'rgba(255,255,255,0)');lg.addColorStop(1,'rgba(0,0,0,.45)');d.fillStyle=lg;d.fillRect(1,1,S-2,S-2);
  d.strokeStyle='rgba(255,255,255,.5)';d.lineWidth=1.5;d.strokeRect(3,3,S-6,S-6);d.fillStyle='rgba(255,255,255,.35)';d.fillRect(5,5,S-14,3);this.spr[k]=q}},
rnd(){return 'IOTSZJL'[Math.random()*7|0]},

rot(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())},
burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.4+Math.random())*sp;this.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:14+Math.random()*14,c:col})}},
lock(){this.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)this.b[this.y+j][this.x+i]=this.k}));

tick(){for(const q of this.pt){q.x+=q.vx;q.y+=q.vy;q.vy+=.5;q.l--}this.pt=this.pt.filter(q=>q.l>0);for(const f of this.fx)f.t--;this.fx=this.fx.filter(f=>f.t>0);
