 fill(a){const P=G.player,w=G.world;const c=[relCoord(a[0],P.x),relCoord(a[1],P.y),relCoord(a[2],P.z),relCoord(a[3],P.x),relCoord(a[4],P.y),relCoord(a[5],P.z)].map(Math.floor);const id=a[6]==='air'?0:findItem(a[6]);
  if(c.some(v=>!isFinite(v))||id===null||id>=256){UI.msg('Benutzung: /fill <x1 y1 z1 x2 y2 z2> <block>','#ffb0a0');return}
  const x0=Math.min(c[0],c[3]),x1=Math.max(c[0],c[3]),y0=Math.max(0,Math.min(c[1],c[4])),y1=Math.min(WH-1,Math.max(c[1],c[4])),z0=Math.min(c[2],c[5]),z1=Math.max(c[2],c[5]);const vol=(x1-x0+1)*(y1-y0+1)*(z1-z0+1);
  if(vol>32768){UI.msg('Zu groß (max. 32768 Blöcke).','#ffb0a0');return}let n=0;for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){if(w.has(x,z)&&w.setBlock(x,y,z,id,0,3))n++}UI.msg(n+' Blöcke gesetzt.','#bfe6ff')},
 gamerule(a){const r=(a[0]||'').toLowerCase(),v=(a[1]||'').toLowerCase();const b=v==='true'||v==='an'||v==='1';
  if(r==='keepinventory'){G.meta.keepInv=b;UI.msg('keepInventory = '+b,'#bfe6ff')}else if(r==='mobgriefing'){G.opts.grief=b?1:0;G.saveOpts();UI.msg('mobGriefing = '+b,'#bfe6ff')}else UI.msg('Regeln: keepinventory, mobgriefing','#ffb0a0')}
};

 chatSubmit(t){if(t[0]==='/'){const parts=t.slice(1).trim().split(/\s+/);const name=(parts.shift()||'').toLowerCase();const f=CMD[name];UI.msg(t,'#aaaaaa');

  else UI.msg('<Du> '+t,'#ffffff')},
 setMode(m){const P=this.player;this.mode=m;if(this.meta)this.meta.mode=m;P.creative=m==='creative';if(!P.creative){P.flying=false}else{P.hp=20;P.food=20}Inv.ver++;if(UI.cur&&WINDOWS.has(UI.cur.name)&&UI.cur.name!=='cmds')UI.hideScreen()}
});

// ===== Boot: WebGL check, error reporting, start =====
(function(){
 const app=document.getElementById('app');
 window.__errs=[];
 function fatal(title,msg){
  try{app.replaceChildren()}catch(e){app.innerHTML=''}
  const d=document.createElement('div');d.className='fatal';
  const a=document.createElement('b');a.textContent=title;
  const p=document.createElement('p');p.textContent=msg;
  const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Neu laden';b.addEventListener('click',()=>location.reload());
  d.append(a,p,b);app.append(d)}
 function report(msg){
  window.__errs.push(msg);
  if(window.__errs.length<=3&&window.UI&&UI.msg&&G.state){try{UI.msg('[Fehler] '+msg,'#ff6a5a')}catch(e){}}}
 window.addEventListener('error',e=>{report((e.message||'Fehler')+(e.lineno?' ('+e.lineno+')':''))});
 window.addEventListener('unhandledrejection',e=>{const r=e.reason;report((r&&r.message)||String(r))});
 // WebGL available?
 let gl=null;
 try{const c=document.createElement('canvas');gl=c.getContext('webgl2')||c.getContext('webgl')||c.getContext('experimental-webgl')}catch(e){}
 if(!gl){fatal('WebGL fehlt','Dein Browser oder Gerät kann keine 3D-Grafik (WebGL) darstellen. Probiere einen aktuellen Browser oder aktiviere die Hardwarebeschleunigung.');return}
 try{const lose=gl.getExtension('WEBGL_lose_context');if(lose)lose.loseContext()}catch(e){}
 if(typeof THREE==='undefined'){fatal('three.js nicht geladen','Die 3D-Bibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung und lade neu.');return}
 try{Input.init()}catch(e){fatal('Startfehler',String(e&&e.message||e));return}
 G.boot().catch(e=>{console.error(e);fatal('Startfehler',String(e&&e.message||e))});
})();
