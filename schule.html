<style>
:root{--acc:#6366f1;--acc2:#06b6d4;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;
 --bg:#f5f6fb;--bg2:#eceef7;--panel:#ffffff;--panel2:#f7f8fc;--line:#e3e6f0;--ink:#151829;--mute:#6b7189;--shadow:0 1px 2px #1018280d,0 8px 24px -8px #1018281f;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--bg2:#11142280;--panel:#141828;--panel2:#1a1f33;--line:#262c45;--ink:#e8eaf6;--mute:#8d93b0;--shadow:0 1px 2px #0006,0 12px 32px -12px #000a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d17;--bg2:#11142280;--panel:#141828;--panel2:#1a1f33;--line:#262c45;--ink:#e8eaf6;--mute:#8d93b0;--shadow:0 1px 2px #0006,0 12px 32px -12px #000a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(700px 500px at -10% 110%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent 70%)}
a{color:var(--acc)}

button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
::selection{background:color-mix(in srgb,var(--acc) 30%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:4px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px -6px var(--acc)}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--mute);letter-spacing:0}
.nav-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;font-weight:500;font-size:.92rem;color:var(--ink);text-align:left;transition:background .15s,color .15s}

.nav button.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:650}
.nav button .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;line-height:18px;font-weight:700}
.side .foot{margin-top:auto;padding:12px 8px 0;display:flex;gap:6px}
.kbd{font:600 .72rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--mute);background:var(--panel)}
.main{min-width:0;padding:22px clamp(16px,3vw,40px) 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:800}
.top p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.top .sp{flex:1}
.top .burger{display:none}
.scrim{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--panel)}
 body.nav-open .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:35}
 body.nav-open .scrim{opacity:1;pointer-events:auto}
 .top .burger{display:inline-flex}

}
/* ---------- Bausteine ---------- */

.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c8{grid-column:span 12}}
@media (max-width:700px){.c4,.c6,.c8{grid-column:span 12}.c3{grid-column:span 6}.grid{gap:12px}.stat b{font-size:1.4rem}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .sp{flex:1}
.muted{color:var(--mute)}.small{font-size:.84rem}

.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.gh{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:9px}
.btn.icon{padding:7px;width:36px;height:36px}
.btn.x{background:none;border:0;color:var(--mute);padding:4px 8px}.btn.x:hover{color:var(--bad)}

.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

.big{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}

/* Kacheln Uebersicht */

.hero h2{font-size:1.4rem;color:#fff}

.stat{display:flex;flex-direction:column;gap:2px}

.qk{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s}

.qk .i{font-size:1.5rem}.qk b{font-size:.92rem}.qk span{font-size:.78rem;color:var(--mute)}
/* Command palette */
.pal{position:fixed;inset:0;background:#0007;backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px;z-index:90}
.pal.on{display:flex}
.pal .box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px #0007;overflow:hidden;animation:vin .2s}

/* 3D */
.stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1c2240,#0a0c18);border:1px solid var(--line);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%}
.stage .hud{position:absolute;left:12px;top:10px;color:#cdd3f5;font-size:.78rem;pointer-events:none;text-shadow:0 1px 3px #000}

.sl{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.sl output{font:600 .88rem var(--mono);text-align:right}
.formula{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.08rem;line-height:1.6}
.res{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}

.res .v{font:700 1.35rem var(--mono)}
.res .f{font-size:.86rem;color:var(--mute);font-family:'Cambria Math',Georgia,serif}
</style>

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}

@media (max-width:560px){.eldet{grid-template-columns:1fr}}
/* Plotter */
.plot{height:min(62vh,520px)}
.fn-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.fn-row i{width:14px;height:14px;border-radius:4px}

/* Ferien */
.cd4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin:12px 0}
.cd4 div{border:1px solid var(--line);border-radius:16px;padding:12px 4px;background:var(--panel2)}
.cd4 b{display:block;font:800 2rem var(--mono)}
.cd4 small{color:var(--mute);font-size:.75rem}
.qcd{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.qcd div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2)}
.qcd b{display:block;font:700 1.05rem var(--mono)}
/* Notizen */
.note{width:100%;min-height:420px;resize:vertical;line-height:1.6;padding:16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);outline:none}

/* Ueben */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.course{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.course:hover{transform:translateY(-3px);border-color:var(--acc)}
.course.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.course .ic{font-size:1.6rem}
.course span{font-size:.8rem;color:var(--mute)}
.q{font-size:1.4rem;font-weight:700;margin:12px 0;letter-spacing:-.01em}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--mute);margin-top:10px}
/* Einheiten */
.uconv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.uconv .in{width:100%}
.uconv label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--mute);font-weight:600}
@media (max-width:560px){.uconv{grid-template-columns:1fr}.uconv .sw{justify-self:center}}
.utab{font:.86rem var(--mono)}

/* ---------- Mathe-Engine: Parser -> kompilierte Funktion (kein eval) ---------- */
var MATH=(function(){
 var FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,sqrt:Math.sqrt,'√':Math.sqrt,ln:Math.log,log:Math.log10,lg:Math.log10,abs:Math.abs,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,sgn:Math.sign};

   if('+-*/^()!%'.indexOf(s[i])>=0){t.push({t:s[i]});i++;continue}
   throw Error('Unbekanntes Zeichen „'+s[i]+'“')}return t}
 function compile(src,opt){opt=opt||{};var T=tok(src),p=0;if(!T.length)throw Error('Leer');
  function pk(){return T[p]}function nx(){return T[p++]}

  function add(a,b){return function(e){return a(e)+b(e)}}function sub(a,b){return function(e){return a(e)-b(e)}}
  function term(){var a=unary();for(;;){var x=pk();if(x&&(x.t==='*'||x.t==='/')){nx();var b=unary();a=x.t==='*'?(function(a,b){return function(e){return a(e)*b(e)}})(a,b):(function(a,b){return function(e){return a(e)/b(e)}})(a,b)}else if(sp(x)){var c=unary();a=(function(a,b){return function(e){return a(e)*b(e)}})(a,c)}else return a}}
  function unary(){var x=pk();if(x&&(x.t==='-'||x.t==='+')){nx();var v=unary();return x.t==='-'?function(e){return -v(e)}:v}return power()}
  function power(){var b=postfix();if(pk()&&pk().t==='^'){nx();var ex=unary();return function(e){return Math.pow(b(e),ex(e))}}return b}

   if(x.t==='n'){var c=x.v;return function(){return c}}
   if(x.t==='('){var v=expr();if(pk()&&pk().t===')')nx();else if(pk())throw Error('Klammer fehlt');return v}
   if(x.t==='id'){var f=x.v;
    if(f==='pi'||f==='π')return function(){return Math.PI};if(f==='e')return function(){return Math.E};

<script>
