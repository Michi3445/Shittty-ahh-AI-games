<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Retro 98 Desktop</title>
<style>
/* ================= Basis ================= */
:root,.vscope{
  --raised:inset -1px -1px var(--dark),inset 1px 1px var(--hi),inset -2px -2px var(--shadow),inset 2px 2px var(--light);
  --pressed:inset -1px -1px var(--hi),inset 1px 1px var(--dark),inset -2px -2px var(--light),inset 2px 2px var(--shadow);
  --frame:inset -1px -1px var(--dark),inset 1px 1px var(--light),inset -2px -2px var(--shadow),inset 2px 2px var(--hi);
  --sunken:inset -1px -1px var(--hi),inset 1px 1px var(--shadow),inset -2px -2px var(--light),inset 2px 2px var(--dark);
  --thinup:inset -1px -1px var(--shadow),inset 1px 1px var(--hi);
  --thindown:inset -1px -1px var(--hi),inset 1px 1px var(--shadow);
}
:root{
  --desk:#008080;
  --face:#c0c0c0;--hi:#ffffff;--light:#dfdfdf;--shadow:#808080;--dark:#0a0a0a;
  --t1:#000080;--t2:#1084d0;--it1:#808080;--it2:#b5b5b5;--tt:#ffffff;--itt:#d4d0c8;
  --sel:#000080;--selt:#ffffff;--win:#ffffff;--text:#000000;--tip:#ffffe1;
  --font:"Microsoft Sans Serif",Tahoma,"MS Sans Serif",Geneva,"Segoe UI",Arial,sans-serif;
  --mono:"Lucida Console",Consolas,"DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font:11px/1.3 var(--font);color:var(--text);-webkit-user-select:none;user-select:none;cursor:default;
  -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
img{-webkit-user-drag:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
.scroll,.lv,.lst,textarea,.bw-page,.hp-body{touch-action:pan-x pan-y}
.sel-text,textarea,input{-webkit-user-select:text;user-select:text}

#screen{position:fixed;inset:0;overflow:hidden;background:var(--desk)}
#desktop{position:absolute;left:0;top:0;right:0;bottom:28px;overflow:hidden;z-index:0;
  background-color:var(--desk);background-repeat:repeat;background-position:0 0}
body.autohide #desktop{bottom:2px}
#icons{position:absolute;inset:0}

/* ================= Rahmen-Helfer ================= */
.raised{background:var(--face);box-shadow:var(--raised)}
.sunken{background:var(--win);box-shadow:var(--sunken)}
.thinup{box-shadow:var(--thinup)}
.thindown{box-shadow:var(--thindown)}
.hsep{height:2px;border-top:1px solid var(--shadow);border-bottom:1px solid var(--hi);margin:8px 0}
.vsep{width:2px;align-self:stretch;border-left:1px solid var(--shadow);border-right:1px solid var(--hi);margin:2px 3px}
.row{display:flex;align-items:center;gap:6px}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}
.dim{color:var(--shadow)}

/* ================= Buttons ================= */
.btn{min-width:75px;height:23px;padding:0 12px;border:0;border-radius:0;background:var(--face);color:var(--text);
  box-shadow:var(--raised);outline:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;flex:none}
.btn:not(:disabled):active,.btn.down{box-shadow:var(--pressed);padding:2px 11px 0 13px}
.btn.default{box-shadow:inset -2px -2px var(--dark),inset 1px 1px var(--dark),inset 2px 2px var(--hi),inset -3px -3px var(--shadow),inset 3px 3px var(--light)}
.btn.default:not(:disabled):active{box-shadow:inset 0 0 0 1px var(--dark),inset 2px 2px var(--shadow),inset -2px -2px var(--shadow)}
.btn:focus-visible{outline:1px dotted var(--text);outline-offset:-5px}
.btn:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hi)}
.btn.sm{min-width:0;padding:0 7px;height:21px}
.btn.sq{min-width:0;width:23px;padding:0}

/* ================= Fenster ================= */
.window{position:absolute;display:flex;flex-direction:column;padding:3px;background:var(--face);box-shadow:var(--frame);outline:none;min-width:90px}
.window.auto{width:auto;height:auto}
.titlebar{flex:none;height:18px;display:flex;align-items:center;gap:3px;padding:0 2px;color:var(--itt);font-weight:bold;
  background:linear-gradient(90deg,var(--it1),var(--it2));overflow:hidden}
.window.active>.titlebar{background:linear-gradient(90deg,var(--t1),var(--t2));color:var(--tt)}
.ticon{width:16px;height:16px;flex:none}
.ttext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1px}
.tbtns{display:flex;align-items:center;flex:none}
.tbtn{width:16px;height:14px;padding:0;border:0;background:var(--face);box-shadow:var(--raised);color:#000;
  display:flex;align-items:center;justify-content:center;outline:none;flex:none}
.tbtn:not(.dis):active{box-shadow:var(--pressed)}
.tbtn:not(.dis):active svg{transform:translate(1px,1px)}
.tbtn.dis{color:var(--shadow)}
.tbtn.dis svg{filter:drop-shadow(1px 1px 0 var(--hi))}
.tbtn.close,.tbtn.help+.tbtn.close{margin-left:2px}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rz{position:absolute;z-index:3}
.rz.n{top:-2px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.s{bottom:-2px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz.e{right:-2px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.w{left:-2px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz.ne{top:-2px;right:-2px;width:10px;height:10px;cursor:nesw-resize}
.rz.nw{top:-2px;left:-2px;width:10px;height:10px;cursor:nwse-resize}
.rz.se{bottom:-2px;right:-2px;width:14px;height:14px;cursor:nwse-resize}
.rz.sw{bottom:-2px;left:-2px;width:10px;height:10px;cursor:nesw-resize}
.window.max .rz{display:none}
.statusbar{flex:none;display:flex;gap:2px;padding-top:2px;height:22px}
.statusbar>div{box-shadow:var(--thindown);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.statusbar>div img{width:16px;height:16px}
.sgrip{width:13px;align-self:stretch;flex:none;box-shadow:none!important;padding:0!important;background-position:right bottom;background-repeat:no-repeat}
.zoomfx{position:fixed;z-index:9500;pointer-events:none;height:18px;background:linear-gradient(90deg,var(--t1),var(--t2));transition:all .2s linear}

/* ================= Menüs ================= */
.menubar{flex:none;display:flex;flex-wrap:wrap;padding:1px 0}
.mb{padding:3px 6px;line-height:12px}
.mb:hover{box-shadow:var(--thinup)}
.menubar.active .mb:hover{box-shadow:none}
.mb.open,.menubar.active .mb.open{box-shadow:var(--thindown)}
#menus{position:fixed;inset:0;pointer-events:none;z-index:10000}
.menu{position:fixed;pointer-events:auto;background:var(--face);box-shadow:var(--frame);padding:3px;min-width:130px;animation:mdown .13s ease-out}
.menu.up{animation-name:mup}
.menu.side{animation-name:mside}
.menu.noanim{animation:none}
@keyframes mdown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mup{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mside{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.mi{display:flex;align-items:center;height:20px;white-space:nowrap;padding-right:4px;color:var(--text)}
.mi.hl{background:var(--sel);color:var(--selt)}
.mi.bold .mil{font-weight:bold}
.mic{width:24px;flex:none;display:flex;align-items:center;justify-content:center;align-self:stretch}
.mic img{width:16px;height:16px}
.mil{flex:1;padding-right:12px}
.mis{padding:0 6px 0 16px}
.mia{width:10px;height:8px;position:relative;flex:none}
.mia::after{content:"";position:absolute;left:3px;top:0;border-style:solid;border-width:4px 0 4px 4px;border-color:transparent transparent transparent currentColor}
.mi.dis{color:var(--shadow)}
.mi.dis .mil,.mi.dis .mis{text-shadow:1px 1px 0 var(--hi)}
.mi.dis.hl .mil,.mi.dis.hl .mis{text-shadow:none}
.menu .sep{height:2px;margin:3px 0 4px;border-top:1px solid var(--shadow);border-bottom:1px solid var(--hi)}
.menu.start{display:flex;padding:3px;min-width:0}
.menu.start .mlist{min-width:150px}
.menu.start>.mlist>.mi{height:32px}
.menu.start>.mlist>.mi .mic{width:40px}
.menu.start>.mlist>.mi .mic img{width:32px;height:32px}
body.smallstart .menu.start>.mlist>.mi{height:22px}
body.smallstart .menu.start>.mlist>.mi .mic{width:26px}
body.smallstart .menu.start>.mlist>.mi .mic img{width:16px;height:16px}
.banner{width:21px;flex:none;position:relative;overflow:hidden;margin-right:1px;background:linear-gradient(0deg,#000080,#1084d0)}
.banner span{position:absolute;left:0;bottom:6px;width:21px;writing-mode:vertical-rl;transform:rotate(180deg);
  font:bold 18px/21px "Arial Black",Arial,Helvetica,sans-serif;color:#d0d0d0;white-space:nowrap;letter-spacing:.3px}
.banner span i{font-style:normal;font-weight:normal;color:#fff;font-family:Arial,Helvetica,sans-serif}

/* ================= Taskleiste ================= */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:28px;background:var(--face);z-index:1;
  box-shadow:inset 0 1px var(--light),inset 0 2px var(--hi);display:flex;align-items:center;padding:3px 2px 1px}
body.autohide #taskbar{transform:translateY(25px);transition:transform .15s}
body.autohide #taskbar:hover,body.autohide #taskbar.show{transform:none}
#startbtn{flex:none;height:22px;display:flex;align-items:center;gap:3px;padding:0 6px 0 3px;font-weight:bold;background:var(--face);box-shadow:var(--raised)}
#startbtn img{width:16px;height:16px}
#startbtn.down{box-shadow:var(--pressed);padding:2px 5px 0 4px}
#startbtn.down span{outline:1px dotted #000;outline-offset:1px}
.tsep{flex:none;width:2px;height:20px;margin:0 2px 0 3px;border-left:1px solid var(--shadow);border-right:1px solid var(--hi)}
.tgrip{flex:none;width:3px;height:18px;margin:0 2px 0 1px;box-shadow:var(--thinup)}
#quick{display:flex;flex:none}
.qb{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.qb img{width:16px;height:16px}
.qb:hover{box-shadow:var(--thinup)}
.qb:active{box-shadow:var(--thindown)}
.qb:active img{transform:translate(1px,1px)}
#tasks{flex:1;min-width:0;display:flex;gap:3px;padding:0 3px;overflow:hidden}
.task{flex:0 1 160px;min-width:26px;height:22px;display:flex;align-items:center;gap:3px;padding:0 4px;background:var(--face);box-shadow:var(--raised);overflow:hidden}
.task img{width:16px;height:16px;flex:none}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{box-shadow:var(--pressed);font-weight:bold;padding-top:2px;background-image:repeating-conic-gradient(var(--hi) 0 25%,transparent 0 50%);background-size:2px 2px}
#tray{flex:none;height:22px;display:flex;align-items:center;gap:3px;padding:0 3px 0 5px;box-shadow:var(--thindown)}
#tray img{width:16px;height:16px;display:block}
#clock{padding:0 3px 0 4px;white-space:nowrap}
body.noclock #clock{display:none}
.volpop{position:fixed;z-index:9600;background:var(--face);box-shadow:var(--frame);padding:8px 10px;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px}
.volpop .vwrap{width:24px;height:96px;position:relative}
.volpop .vwrap input{position:absolute;left:-36px;top:36px;width:96px;transform:rotate(-90deg)}

/* ================= Desktop-Symbole ================= */
.dic,.lvi{display:flex;flex-direction:column;align-items:center;touch-action:none}
.dic{position:absolute;width:80px;padding-top:3px;color:#fff}
.im{position:relative;width:32px;height:32px;flex:none}
.im img{width:32px;height:32px;display:block}
.im .sc{position:absolute;left:0;bottom:0;width:11px;height:11px}
.tint{position:absolute;inset:0;background:var(--sel);opacity:0;-webkit-mask:var(--m) center/32px 32px no-repeat;mask:var(--m) center/32px 32px no-repeat;pointer-events:none}
.sel>.im .tint{opacity:.55}
.lb{margin-top:3px;padding:0 2px 1px;text-align:center;line-height:13px;border:1px dotted transparent;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dic .lb{max-width:80px;background:var(--desk)}
.sel>.lb{background:var(--sel)!important;color:var(--selt);-webkit-line-clamp:6}
.dic.sel.focus>.lb{border-color:#ffff80}
.dic.cut{opacity:.5}
.lb input.ren{width:72px;height:auto;padding:0 1px;border:1px solid #000;background:#fff;color:#000;font:inherit;text-align:center;outline:none}
#marquee{position:absolute;border:1px dotted #fff;mix-blend-mode:difference;display:none;pointer-events:none;z-index:4}

/* ================= Formulare ================= */
.tx{height:21px;padding:2px 3px;border:0;border-radius:0;background:var(--win);box-shadow:var(--sunken);outline:none;color:var(--text);min-width:0}
textarea.tx{height:auto;resize:none;padding:3px}
.tx:disabled,.tx[readonly].ro{background:var(--face)}
select.tx{appearance:none;-webkit-appearance:none;padding-right:21px;background-image:var(--combo);background-repeat:no-repeat;background-position:right 2px center;background-size:16px 17px}
select.tx::-ms-expand{display:none}
.chk{display:inline-flex;align-items:center;gap:5px}
.chk input{appearance:none;-webkit-appearance:none;width:13px;height:13px;margin:0;background:var(--win);box-shadow:var(--sunken);flex:none;outline:none}
.chk input:checked{background-image:var(--check);background-position:center;background-repeat:no-repeat}
.chk input[type=radio]{width:12px;height:12px;border-radius:50%}
.chk input[type=radio]:checked{background-image:radial-gradient(circle,#000 0 1.8px,transparent 2.3px)}
.chk input:disabled{background-color:var(--face)}
.chk input:focus-visible+span{outline:1px dotted #000}
input[type=range].sl{appearance:none;-webkit-appearance:none;background:transparent;height:24px;width:100%;outline:none;margin:0}
input[type=range].sl::-webkit-slider-runnable-track{height:4px;box-shadow:var(--sunken);background:var(--face)}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:21px;margin-top:-9px;background:var(--face);box-shadow:var(--raised);border:0}
input[type=range].sl::-moz-range-track{height:4px;box-shadow:var(--sunken);background:var(--face)}
input[type=range].sl::-moz-range-thumb{width:11px;height:21px;border:0;border-radius:0;background:var(--face);box-shadow:var(--raised)}
fieldset.grp{border:1px solid var(--shadow);box-shadow:inset 1px 1px var(--hi),1px 1px var(--hi);margin:0;padding:8px 10px 10px;min-width:0}
fieldset.grp legend{padding:0 3px;margin-left:-3px}
.lst{background:var(--win);box-shadow:var(--sunken);overflow:auto;padding:2px}
.lst .it{padding:1px 3px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.lst .it img{width:16px;height:16px}
.lst .it.sel{background:var(--sel);color:var(--selt)}
.lst.dotted .it.sel{outline:1px dotted #ffff80;outline-offset:-1px}
.prog{height:18px;box-shadow:var(--thindown);padding:2px;background:var(--face)}
.prog>div{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sel) 0 8px,transparent 8px 10px);transition:width .15s}
.tabs{display:flex;padding-left:2px;height:21px;align-items:flex-end;position:relative;z-index:1;flex:none}
.tab{padding:2px 7px 3px;margin-right:-1px;background:var(--face);height:18px;border-radius:3px 3px 0 0;
  box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dark),inset -2px 0 var(--shadow),inset 2px 2px var(--light);white-space:nowrap}
.tab.sel{height:21px;margin:0 -2px 0 -2px;padding:3px 9px 5px;position:relative;z-index:2;background:var(--face)}
.tab.sel+.tab{margin-left:1px}
.tabpane{background:var(--face);box-shadow:var(--frame);padding:12px 10px;flex:1;min-height:0;position:relative}
.tabpane>div{height:100%}

/* ================= Dialoge ================= */
.msg{display:flex;gap:14px;padding:14px 14px 6px;align-items:flex-start;max-width:440px}
.msg>img{width:32px;height:32px;flex:none}
.msgtext{padding-top:2px;line-height:1.4;min-width:160px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.msgbtns{display:flex;justify-content:center;gap:6px;padding:10px 12px 10px}
.dlgbtns{display:flex;justify-content:flex-end;gap:6px;padding:8px 2px 2px;flex:none}
.pad{padding:10px}
.details{font:11px/1.35 var(--mono);height:110px;margin:0 12px 12px;white-space:pre}
#dither{position:absolute;inset:0;z-index:2;background:repeating-conic-gradient(rgba(0,0,0,.72) 0 25%,transparent 0 50%) 0 0/2px 2px}
#overlay{position:absolute;inset:0;z-index:3;pointer-events:none}
#overlay>*{pointer-events:auto}
#tip{position:fixed;z-index:10001;background:var(--tip);color:#000;border:1px solid #000;padding:1px 4px 2px;white-space:nowrap;pointer-events:none;display:none}

/* ================= Explorer ================= */
.toolbar{flex:none;display:flex;align-items:stretch;padding:2px;border-bottom:1px solid var(--shadow);box-shadow:0 1px var(--hi);margin-bottom:2px;overflow:hidden}
.tbb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;padding:2px 5px;gap:1px;flex:none}
.tbb img{width:20px;height:20px}
.tbb.small{flex-direction:row;gap:4px}
.tbb.small img{width:16px;height:16px}
.tbb:hover:not(.dis){box-shadow:var(--thinup)}
.tbb:active:not(.dis){box-shadow:var(--thindown)}
.tbb:active:not(.dis)>*{transform:translate(1px,1px)}
.tbb.dis{color:var(--shadow);text-shadow:1px 1px var(--hi)}
.tbb.dis img{filter:grayscale(1) opacity(.45)}
.addr{flex:none;display:flex;align-items:center;gap:4px;padding:1px 3px 4px;border-bottom:1px solid var(--shadow);box-shadow:0 1px var(--hi);margin-bottom:3px}
.addr .abox{flex:1;display:flex;align-items:center;gap:3px;height:21px;background:var(--win);box-shadow:var(--sunken);padding:0 2px 0 3px;min-width:0}
.addr .abox img{width:16px;height:16px}
.addr .abox input{flex:1;border:0;outline:none;background:transparent;height:17px;min-width:0;padding:0 2px}
.exmain{flex:1;display:flex;min-height:0;box-shadow:var(--sunken);background:var(--win);padding:2px}
.webview{width:176px;flex:none;padding:10px 12px;overflow:hidden;color:var(--text);background:var(--win)}
.webview .wvimg{width:32px;height:32px}
.webview h2{font:bold 17px/1.15 Arial,Helvetica,sans-serif;margin:6px 0;overflow-wrap:anywhere}
.webview .wvline{height:3px;margin-bottom:10px;background:linear-gradient(90deg,#d40000,#ff9c00 30%,#ffe000 50%,#2a7fff 75%,transparent)}
.webview .wvtext{line-height:1.45;overflow-wrap:anywhere}
.webview .wvtext b{font-size:12px}
.lv{flex:1;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;padding:4px 2px;background:var(--win)}
.lvi{width:78px;padding:2px 0 6px;color:var(--text)}
.lvi .lb{max-width:76px}
.lv.details{display:block;padding:0}
.empty-note{padding:10px;color:var(--shadow)}

/* ================= Programme ================= */
.np-text{flex:1;border:0;outline:none;resize:none;padding:2px 3px;background:var(--win);box-shadow:var(--sunken);font:13px/1.25 var(--mono);color:#000;white-space:pre;overflow:auto}
.np-text.wrap{white-space:pre-wrap}
.calc{padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
.calc .disp{height:23px;text-align:right;padding:3px 5px;font:12px var(--font);overflow:hidden;white-space:nowrap}
.calc .rowtop{display:flex;gap:6px;align-items:center}
.calc .memi{width:28px;height:26px;box-shadow:var(--thindown);display:flex;align-items:center;justify-content:center;flex:none}
.calc .grid{display:grid;grid-template-columns:28px 10px repeat(5,36px);grid-auto-rows:29px;gap:4px 5px}
.calc .grid .gap{width:10px}
.calc .btn{min-width:0;padding:0;height:auto;font-size:12px}
.calc .btn.r{color:#e00000}.calc .btn.b{color:#0000e0}.calc .btn.n{color:#000080}
.calc .wide{flex:1;height:28px;color:#e00000}
.pt-wrap{flex:1;display:flex;min-height:0;gap:2px}
.pt-tools{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;padding:2px 0}
.pt-tools .tg{display:grid;grid-template-columns:25px 25px;gap:0}
.pt-tool{width:25px;height:25px;display:flex;align-items:center;justify-content:center;background:var(--face);box-shadow:var(--raised)}
.pt-tool.on{box-shadow:var(--pressed);background-image:repeating-conic-gradient(var(--hi) 0 25%,transparent 0 50%);background-size:2px 2px}
.pt-tool.dis{opacity:.45}
.pt-opts{margin-top:6px;width:42px;height:66px;box-shadow:var(--thindown);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:2px}
.pt-opt{width:36px;height:13px;display:flex;align-items:center;justify-content:center}
.pt-opt.on{background:var(--sel)}
.pt-area{flex:1;overflow:auto;background:#808080;box-shadow:var(--sunken);position:relative;min-width:0}

/* ================= Tooltip ================= */
const Tip={
  el:null,t:null,lx:0,ly:0,
  init(){ this.el=h('div',{id:'tip'}); document.body.append(this.el); },
  bind(el,fn){
    el.addEventListener('pointerenter',e=>{ if(isTouch(e)) return; this.lx=e.clientX; this.ly=e.clientY; clearTimeout(this.t);
      this.t=setTimeout(()=>{ const txt=typeof fn==='function'?fn():fn; if(txt) this.show(txt); },650); });
    el.addEventListener('pointermove',e=>{ this.lx=e.clientX; this.ly=e.clientY; });
    el.addEventListener('pointerleave',()=>this.hide());
    el.addEventListener('pointerdown',()=>this.hide());
  },
  show(txt){
    this.el.textContent=txt; this.el.style.display='block';
    const r=this.el.getBoundingClientRect(); let x=this.lx, y=this.ly+20;
    if(x+r.width>innerWidth-2) x=innerWidth-r.width-2; if(y+r.height>innerHeight-2) y=this.ly-r.height-6;
    this.el.style.left=Math.max(0,x)+'px'; this.el.style.top=Math.max(0,y)+'px';
  },
  hide(){ clearTimeout(this.t); if(this.el) this.el.style.display='none'; }
};

/* Langer Druck (Touch) als Rechtsklick-Ersatz */
function longPress(el,cb,ms=550){
  let t=null,sx=0,sy=0;
  el.addEventListener('pointerdown',e=>{ if(!isTouch(e)) return; sx=e.clientX; sy=e.clientY; clearTimeout(t); t=setTimeout(()=>{ t=null; cb(e); },ms); });
  el.addEventListener('pointermove',e=>{ if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){ clearTimeout(t); t=null; } });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{ clearTimeout(t); t=null; }));
}
/* Doppelklick-Erkennung, die auch auf Touch funktioniert */
const Dbl={
  ms:store.get('dblms',500),last:null,
  hit(key,e){ const now=performance.now(); const l=this.last;
    const ok=l&&l.key===key&&now-l.t<this.ms&&Math.hypot(e.clientX-l.x,e.clientY-l.y)<8;
    this.last=ok?null:{key,t:now,x:e.clientX,y:e.clientY}; return ok; }
};
function download(name,dataUrl){ const a=h('a',{href:dataUrl,download:name}); document.body.append(a); a.click(); a.remove(); }
function mix(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const c=s=>Math.round(((pa>>s)&255)*(1-t)+((pb>>s)&255)*t);
  return '#'+((1<<24)|(c(16)<<16)|(c(8)<<8)|c(0)).toString(16).slice(1);
}

    const bw=h('div',{class:'msgbtns'}); let w;

const Calc={
  open(){
    return WM.single('calc',()=>{
      let cur='0',acc=null,op=null,fresh=true,lastOp=null,lastArg=null,mem=0,err=null,w;
      const disp=h('div',{class:'disp sunken'}),memi=h('div',{class:'memi'});
      const OPS={'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b,'/':(a,b)=>b===0?NaN:a/b};
      const norm=n=>{ if(Object.is(n,-0)) n=0; let s=String(parseFloat(n.toPrecision(15))); return s; };
      const num=()=>parseFloat(cur)||0;
      function show(){
        if(err){ disp.textContent=err; } else {
          let s=cur, e=''; const ei=s.indexOf('e'); if(ei>=0){ e=s.slice(ei); s=s.slice(0,ei); }

      function setRes(n,msg){ if(!isFinite(n)){ err=msg||'Ungültiges Ergebnis.'; Sound.ding(); return false; } cur=norm(n); return true; }

        if(/^[0-9]$/.test(k)){ if(fresh){ cur=k; fresh=false; } else if(cur==='0') cur=k; else if(cur.replace(/[-.]/g,'').length<32) cur+=k; }
        else if(k==='.'){ if(fresh){ cur='0.'; fresh=false; } else if(!cur.includes('.')&&!cur.includes('e')) cur+='.'; }
        else if(OPS[k]){ if(op&&!fresh){ if(!setRes(OPS[op](acc,num()),op==='/'&&num()===0?'Division durch Null nicht möglich.':null)) { show(); return; } acc=num(); } else if(!op) acc=num(); op=k; fresh=true; lastOp=null; }
        else if(k==='='){
          if(op){ const a=num(); const r=OPS[op](acc,a); lastOp=op; lastArg=a; op=null; if(setRes(r,lastOp==='/'&&a===0?'Division durch Null nicht möglich.':null)) acc=num(); fresh=true; }
          else if(lastOp){ setRes(OPS[lastOp](num(),lastArg),lastOp==='/'&&lastArg===0?'Division durch Null nicht möglich.':null); fresh=true; }
        }
        else if(k==='sqrt'){ if(num()<0){ err='Ungültige Eingabe für Funktion.'; Sound.ding(); } else setRes(Math.sqrt(num())); fresh=true; }
        else if(k==='%'){ setRes((acc==null?0:acc)*num()/100); fresh=true; }
        else if(k==='1/x'){ if(num()===0){ err='Division durch Null nicht möglich.'; Sound.ding(); } else setRes(1/num()); fresh=true; }
        else if(k==='neg'){ if(cur!=='0'&&cur!=='0.') cur=cur.startsWith('-')?cur.slice(1):'-'+cur; }
        else if(k==='back'){ if(!fresh){ cur=cur.slice(0,-1); if(cur===''||cur==='-'||cur==='-0') cur='0'; } }
        else if(k==='CE'){ cur='0'; fresh=true; err=null; }
        else if(k==='C'){ cur='0'; acc=null; op=null; fresh=true; lastOp=null; err=null; }
        else if(k==='MC') mem=0;
        else if(k==='MR'){ cur=norm(mem); fresh=true; }
        else if(k==='MS'){ mem=num(); fresh=true; }
        else if(k==='M+'){ mem+=num(); fresh=true; }

      }
      const btns={};
      const B=(label,k,cls)=>{ const b=h('button',{class:'btn '+(cls||''),text:label,tabindex:'-1'}); b.addEventListener('click',()=>press(k)); btns[k]=b; return b; };

        .forEach(row=>row.forEach((d,i)=>{ grid.append(B(...d)); if(i===0) grid.append(h('div',{class:'gap'})); }));
      const top=h('div',{class:'rowtop'},memi,B('Rücktaste','back','wide'),B('CE','CE','wide'),B('C','C','wide'));
      const body=h('div',{class:'calc'},disp,top,grid);
      const flash=k=>{ const b=btns[k]; if(!b) return; b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),90); };
      w=WM.open({title:'Rechner',icon:'calc',key:'calc',auto:true,resizable:false,body,
        menu:[
          {label:'&Bearbeiten',items:[{label:'&Kopieren',key:'Strg+C',action:()=>{ try{ navigator.clipboard.writeText(disp.textContent.replace(/,$/,'')); }catch(e){} }},{label:'&Einfügen',key:'Strg+V',action:async()=>{ try{ const t=(await navigator.clipboard.readText()).trim().replace(',','.'); if(!isNaN(parseFloat(t))){ cur=norm(parseFloat(t)); fresh=false; show(); } }catch(e){} }}]},
          {label:'&Ansicht',items:[{label:'&Wissenschaftlich',disabled:true},{label:'&Standard',checked:true,radio:true},{sep:true},{label:'Zifferngruppierung',disabled:true}]},
          {label:'&?',items:[{label:'&Hilfethemen',action:()=>launch('help')},{sep:true},{label:'&Info',action:()=>about('Rechner','calc',w)}]}
        ],
        onKey:e=>{
          if(e.ctrlKey){ const m={l:'MC',r:'MR',m:'MS',p:'M+'}[e.key.toLowerCase()]; if(m){ press(m); flash(m); return true; } return false; }

function pixc(rows,pal){
  const w=rows[0].length,hh=rows.length; let s='';
  rows.forEach((r,y)=>{ let x=0; while(x<w){ const ch=r[x]; if(pal[ch]){ let e=x; while(e<w&&r[e]===ch) e++; s+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${pal[ch]}"/>`; x=e; } else x++; } });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" shape-rendering="crispEdges">${s}</svg>`;
}

      function deal(){

const Saver={
  TYPES:[['none','(Kein)'],['stars','Sternenfeld'],['mystify','Polygone'],['pipes','Rohre'],['marquee','Laufschrift']],
  cfg:Object.assign({type:'stars',wait:5,text:'Retro 98'},store.get('saver',{})),
  idleT:null,el:null,raf:0,
  init(){ ['pointermove','pointerdown','keydown','wheel'].forEach(ev=>addEventListener(ev,()=>this.poke(),{passive:true,capture:true})); this.poke(); },
  poke(){ if(this.el) return; clearTimeout(this.idleT); if(this.cfg.type!=='none') this.idleT=setTimeout(()=>{ if(!Power.busy) this.start(); else this.poke(); },this.cfg.wait*60000); },
  setCfg(c){ this.cfg=Object.assign({},c); store.set('saver',this.cfg); this.poke(); },
  make(type,cv,small,cfg){
    const W=cv.width,H=cv.height,x=cv.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,W,H);
    if(type==='stars'){
      const st=Array.from({length:small?70:380},()=>({x:rnd(-1,1),y:rnd(-1,1),z:rnd(0.05,1)}));
      return {step(dt){ x.fillStyle='#000'; x.fillRect(0,0,W,H); const sp=dt*0.0004;
        for(const s of st){ s.z-=sp; const k=0.55/s.z,px=W/2+s.x*k*W/2,py=H/2+s.y*k*H/2;
          if(s.z<=0.02||px<0||py<0||px>W||py>H){ s.x=rnd(-1,1); s.y=rnd(-1,1); s.z=1; continue; }
          const sz=Math.max(1,(1-s.z)*(small?2:3.4)),b=Math.floor(90+165*(1-s.z)); x.fillStyle=`rgb(${b},${b},${b})`; x.fillRect(px,py,sz,sz); } }};
    }
    if(type==='mystify'){
      const sp=small?0.7:2.6,polys=[0,1].map(()=>({pts:Array.from({length:4},()=>({x:rnd(0,W),y:rnd(0,H),vx:rnd(0.4,1)*sp*(Math.random()<0.5?-1:1),vy:rnd(0.4,1)*sp*(Math.random()<0.5?-1:1)})),hist:[],hue:rnd(0,360)}));
      let fr=0;
      return {step(dt){ x.fillStyle='#000'; x.fillRect(0,0,W,H); const f=dt/16; fr++;
        polys.forEach(p=>{ p.pts.forEach(q=>{ q.x+=q.vx*f; q.y+=q.vy*f; if(q.x<0||q.x>W){ q.vx*=-1; q.x=clamp(q.x,0,W); } if(q.y<0||q.y>H){ q.vy*=-1; q.y=clamp(q.y,0,H); } });
          if(fr%3===0){ p.hist.push(p.pts.map(q=>[q.x,q.y])); if(p.hist.length>(small?5:9)) p.hist.shift(); }
          p.hue=(p.hue+0.25*f)%360;
          p.hist.forEach((hh,i)=>{ x.strokeStyle=`hsla(${p.hue},100%,60%,${(i+1)/p.hist.length})`; x.lineWidth=small?1:1.5; x.beginPath(); hh.forEach(([a,b],j)=>j?x.lineTo(a,b):x.moveTo(a,b)); x.closePath(); x.stroke(); }); }); }};
    }
    if(type==='marquee'){
      const text=(cfg&&cfg.text)||this.cfg.text||'Retro 98',fs=small?20:Math.max(36,Math.round(H/7)),cols=['#ffff00','#00ffff','#ff00ff','#00ff00','#ffffff','#ff8000'];
      let xx=W,y=rnd(fs,Math.max(fs+1,H-fs/2)),col=pick(cols);
      return {step(dt){ x.fillStyle='#000'; x.fillRect(0,0,W,H); x.font=`bold ${fs}px Arial, Helvetica, sans-serif`; x.fillStyle=col; x.textBaseline='middle'; x.fillText(text,xx,y);
        xx-=dt*(small?0.05:0.28); if(xx<-x.measureText(text).width){ xx=W; y=rnd(fs,Math.max(fs+1,H-fs/2)); col=pick(cols); } }};
    }
    if(type==='pipes'){
      const S=small?10:Math.max(26,Math.round(Math.min(W,H)/22)),cols=Math.floor(W/S),rows=Math.floor(H/S),grid=new Uint8Array(cols*rows),D=[[1,0],[0,1],[-1,0],[0,-1]];
      const colors=['#d82020','#20a830','#2858e8','#e8c818','#c040c8','#18c0c0','#e87818','#d0d0d0'];
      let pipe=null,count=0,acc=0;
      const joint=(c,r,col)=>{ const cx=c*S+S/2,cy=r*S+S/2,rad=S*0.4,g=x.createRadialGradient(cx-rad*0.35,cy-rad*0.35,rad*0.1,cx,cy,rad); g.addColorStop(0,'#fff'); g.addColorStop(0.3,col); g.addColorStop(1,'#000'); x.fillStyle=g; x.beginPath(); x.arc(cx,cy,rad,0,Math.PI*2); x.fill(); };
      const seg=(c,r,d,col)=>{ const cx=c*S+S/2,cy=r*S+S/2,wd=S*0.48,v=D[d]; const g=v[0]?x.createLinearGradient(0,cy-wd/2,0,cy+wd/2):x.createLinearGradient(cx-wd/2,0,cx+wd/2,0);
        g.addColorStop(0,'#000'); g.addColorStop(0.3,col); g.addColorStop(0.5,'#fff'); g.addColorStop(0.7,col); g.addColorStop(1,'#000'); x.fillStyle=g;
        if(v[0]) x.fillRect(Math.min(cx,cx+v[0]*S),cy-wd/2,S,wd); else x.fillRect(cx-wd/2,Math.min(cy,cy+v[1]*S),wd,S); };
      const reset=()=>{ x.fillStyle='#000'; x.fillRect(0,0,W,H); grid.fill(0); count=0; pipe=null; };
      const fresh=()=>{ for(let t=0;t<60;t++){ const c=rint(0,cols-1),r=rint(0,rows-1); if(!grid[r*cols+c]){ grid[r*cols+c]=1; pipe={c,r,d:rint(0,3),col:pick(colors),len:0,max:rint(25,90)}; joint(c,r,pipe.col); return; } } reset(); };
      const grow=()=>{ if(!pipe){ fresh(); return; } let d=pipe.d; if(Math.random()<0.28) d=(d+(Math.random()<0.5?1:3))%4;
        for(const nd of [d,(d+1)%4,(d+3)%4]){ const nc=pipe.c+D[nd][0],nr=pipe.r+D[nd][1]; if(nc<0||nr<0||nc>=cols||nr>=rows||grid[nr*cols+nc]) continue;
          if(nd!==pipe.d&&pipe.len) joint(pipe.c,pipe.r,pipe.col); seg(pipe.c,pipe.r,nd,pipe.col); grid[nr*cols+nc]=1; pipe.c=nc; pipe.r=nr; pipe.d=nd; pipe.len++; if(pipe.len>pipe.max) break; return; }
        joint(pipe.c,pipe.r,pipe.col); pipe=null; if(++count>(small?5:9)) reset(); };
      return {step(dt){ acc+=dt; const iv=small?55:32; let n=0; while(acc>iv&&n<8){ acc-=iv; grow(); n++; } if(pipe&&pipe.len>pipe.max){ joint(pipe.c,pipe.r,pipe.col); pipe=null; if(++count>(small?5:9)) reset(); } }};
    }
    return {step(){}};
  },
  start(type=this.cfg.type){
    if(this.el||type==='none') return; Menu.closeAll(); Tip.hide();
    const el=h('div',{id:'saver',class:'fullscr'}),cv=h('canvas'); el.append(cv); document.body.append(el); this.el=el;
    cv.width=innerWidth; cv.height=innerHeight;
    const r=this.make(type,cv,false,this.cfg); let last=performance.now();
    const loop=t=>{ if(this.el!==el) return; r.step(Math.min(60,t-last)); last=t; this.raf=requestAnimationFrame(loop); }; this.raf=requestAnimationFrame(loop);
    const t0=performance.now(); let sx=null,sy=null;
    this.exitFn=e=>{ if(performance.now()-t0<700) return; if(e.type==='pointermove'){ if(sx==null){ sx=e.clientX; sy=e.clientY; return; } if(Math.hypot(e.clientX-sx,e.clientY-sy)<10) return; } if(e.type!=='pointermove'){ e.preventDefault(); e.stopPropagation(); } this.stop(); };
    ['pointermove','pointerdown','keydown','wheel'].forEach(ev=>addEventListener(ev,this.exitFn,true));
  },
  stop(){ if(!this.el) return; cancelAnimationFrame(this.raf); this.el.remove(); this.el=null; ['pointermove','pointerdown','keydown','wheel'].forEach(ev=>removeEventListener(ev,this.exitFn,true)); this.poke(); },
  preview(cv,type,cfg){ let stop=false; const r=this.make(type,cv,true,cfg); let last=performance.now(); const loop=t=>{ if(stop||!document.body.contains(cv)) return; r.step(Math.min(60,t-last)); last=t; requestAnimationFrame(loop); }; requestAnimationFrame(loop); return ()=>{ stop=true; }; }
};

    removeEventListener('keydown',sk,true);
    sp.style.transition='opacity .35s'; sp.style.opacity='0'; await sleep(350); sp.remove();
    this.busy=false; Saver.poke(); Sound.startup();
    if(store.get('welcome',true)) setTimeout(()=>launch('welcome'),300);
  },
  shutdownDialog(){
    if(this.dlg&&!this.dlg.closed){ this.dlg.focus(); return; }
    Menu.closeAll();
    const dither=h('div',{id:'dither'}),overlay=h('div',{id:'overlay'}); $('#screen').append(dither,overlay);
    const r1=checkbox('&Herunterfahren',true,null,true,'sd'),r2=checkbox('&Neu starten',false,null,true,'sd'),r3=checkbox('Im &Eingabeaufforderungsmodus neu starten',false,null,true,'sd');
    const ok=h('button',{class:'btn default',text:'OK'}),ca=h('button',{class:'btn',text:'Abbrechen'}),hb=h('button',{class:'btn',text:'Hilfe'});
    let w; ok.onclick=()=>{ const m=r2.input.checked?'restart':r3.input.checked?'dos':'off'; w.close(true); this.shutdown(m); }; ca.onclick=()=>w.close(true); hb.onclick=()=>{ w.close(true); launch('help','startmenu'); };
    w=this.dlg=WM.open({title:'Retro 98 beenden',dialog:true,auto:true,center:true,container:overlay,noTask:true,
      body:h('div',{class:'pad row',style:'gap:16px;align-items:flex-start;width:390px'},h('img',{src:ICON.computer,style:'width:32px;height:32px'}),h('div',{class:'col',style:'gap:8px'},h('div',{text:'Möchten Sie wirklich:'}),r1,r2,r3,h('div',{class:'row',style:'gap:6px;margin-top:10px'},ok,ca,hb))),
      onClosed:()=>{ dither.remove(); overlay.remove(); this.dlg=null; },onKey:e=>{ if(e.key==='Enter'){ ok.click(); return true; } if(e.key==='Escape'){ ca.click(); return true; } return false; }});
    setTimeout(()=>ok.focus(),0);
  },
  async closeAllAsk(){ for(const w of WM.wins.slice()){ if(w.closed) continue; await w.close(); if(!w.closed) return false; } return true; },
  async shutdown(mode){
    if(!await this.closeAllAsk()) return;
    this.busy=true; Saver.stop(); clearTimeout(Saver.idleT); Menu.closeAll(); Dialup.disconnect();
    const sp=h('div',{id:'shutsplash',class:'fullscr'},h('img',{src:ICON.welcome,alt:''}),h('div',{text:mode==='restart'?'Retro 98 wird neu gestartet...':'Retro 98 wird heruntergefahren...'}),h('div',{class:'blink',text:'Bitte warten'}));
    document.body.append(sp); Sound.shutdown(); await sleep(2000); sp.remove();
    if(mode==='restart'){ await sleep(400); return this.boot(); }
    if(mode==='dos') return this.dos();
    const off=h('div',{id:'off',class:'fullscr'},h('div',{text:'Sie können den Computer jetzt ausschalten.'}),h('small',{text:'(Klicken, um den Computer wieder einzuschalten)'}));
    document.body.append(off);
    const on=()=>{ off.remove(); removeEventListener('keydown',on,true); this.boot(); };
    off.addEventListener('click',on); setTimeout(()=>addEventListener('keydown',on,true),500);
  },
  dos(){
    const wrap=h('div',{class:'fullscr',style:'background:#000;display:flex;flex-direction:column'});
    const k=Konsole({dos:true,onExit:()=>{ wrap.remove(); this.boot(); }});
    k.el.style.fontSize='18px'; k.el.style.lineHeight='1.25'; wrap.append(k.el,k.inp); document.body.append(wrap);
    k.start('\nRetro 98 - Eingabeaufforderungsmodus\n\nGeben Sie WIN ein, um zu Retro 98 zurückzukehren.\nHILFE zeigt alle Befehle.\n');
    setTimeout(()=>k.focus(),50); wrap.addEventListener('pointerup',()=>k.focus());
  },
  async logoffAsk(){
    if(await msgBox({title:'Abmelden',text:'Möchten Sie sich wirklich abmelden?',icon:'question',buttons:['Ja','Nein']})!=='Ja') return;
    if(!await this.closeAllAsk()) return;
    this.busy=true; Menu.closeAll(); Sound.shutdown();
    const scr=h('div',{id:'login',class:'fullscr'});
    const inp=h('input',{class:'tx',value:Session.user,style:'flex:1',maxlength:'24'}),ok=h('button',{class:'btn default',text:'OK'}),ca=h('button',{class:'btn',text:'Abbrechen'});
    const box=h('div',{class:'window active',style:'position:relative;width:410px'},h('div',{class:'titlebar'},h('div',{class:'ttext',text:'Willkommen bei Retro 98'})),
      h('div',{class:'pad row',style:'gap:14px;align-items:flex-start'},h('img',{src:ICON.logoff,style:'width:32px;height:32px'}),h('div',{class:'col grow',style:'gap:10px'},h('div',{text:'Geben Sie einen Benutzernamen ein, um sich bei Retro 98 anzumelden.'}),h('div',{class:'row'},h('span',{html:'<u>B</u>enutzername:',style:'width:90px'}),inp)),h('div',{class:'col'},ok,ca)));
    scr.append(box); document.body.append(scr);
    const done=()=>{ const n=inp.value.trim()||'Benutzer'; Session.user=n.slice(0,24); store.set('user',Session.user); scr.remove(); this.busy=false; Sound.startup(); };
    ok.onclick=done; ca.onclick=done; inp.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') done(); });
    setTimeout(()=>{ inp.focus(); inp.select(); },50);
  },
  bsod(){
    if($('#bsod')) return; Menu.closeAll(); Saver.stop();
    const el=h('div',{id:'bsod',class:'fullscr',html:`<div class="bs"><span class="bsh">RETRO 98</span><p>Ein schwerer Ausnahmefehler 0E ist bei 0028:C001A7E3 in VXD RETRO(01) + 00001998 aufgetreten. Die aktuelle Anwendung wird beendet.</p><p>*  Drücken Sie eine beliebige Taste, um die aktuelle Anwendung zu beenden.<br>*  Drücken Sie STRG+ALT+ENTF, um den Computer neu zu starten.<br>&nbsp;&nbsp; Nicht gespeicherte Daten in allen Anwendungen gehen dabei verloren.</p><p class="c">Drücken Sie eine beliebige Taste, um fortzufahren <span class="blink">_</span></p></div>`});
    document.body.append(el); Sound.ding(); this.busy=true;
    const done=e=>{ e.preventDefault(); e.stopPropagation(); removeEventListener('keydown',done,true); el.remove(); this.busy=false; const a=WM.active; if(a&&!a.o.dialog) a.close(true); };
    setTimeout(()=>{ addEventListener('keydown',done,true); el.addEventListener('pointerdown',done); },500);
  },
  restart(){ WM.wins.slice().forEach(w=>w.close(true)); this.shutdown('restart'); }
};

/* ================= Programmregister & Start ================= */
const APPS={
  notepad:{title:'Editor',icon:'notepad',run:a=>Notepad.open(a)},
  calc:{title:'Rechner',icon:'calc',run:()=>Calc.open()},
  paint:{title:'Paint',icon:'paint',run:a=>Paint.open(a)},
  mines:{title:'Minesweeper',icon:'mine',run:()=>Mines.open()},
  sol:{title:'Solitär',icon:'cards',run:()=>Sol.open()},
  cmd:{title:'Eingabeaufforderung',icon:'cmd',run:()=>Cmd.open()},
  explorer:{title:'Explorer',icon:'explorer',run:a=>Explorer.open(a)},
  control:{title:'Systemsteuerung',icon:'control',run:()=>Explorer.open('Systemsteuerung')},
  browser:{title:'Internet',icon:'globe',run:a=>Browser.open(a)},
  mail:{title:'Posteingang',icon:'mail',run:()=>Mail.open()},
  defrag:{title:'Defragmentierung',icon:'defrag',run:()=>defragApp()},
  display:{title:'Anzeige',icon:'display',run:()=>displayProps()},
  datetime:{title:'Datum/Uhrzeit',icon:'clock',run:()=>dateTimeProps()},
  mouseprops:{title:'Maus',icon:'mouse',run:()=>mouseProps()},
  soundprops:{title:'Akustische Signale',icon:'sound',run:()=>soundProps()},
  system:{title:'System',icon:'system',run:()=>systemProps()},
  software:{title:'Software',icon:'software',run:()=>softwareProps()},
  taskbarprops:{title:'Taskleiste',icon:'settings',run:()=>taskbarProps()},
  help:{title:'Hilfe',icon:'help',run:a=>helpApp(a)},
  welcome:{title:'Willkommen',icon:'welcome',run:()=>welcomeApp()},
  run:{title:'Ausführen',icon:'run',run:()=>runDlg()},
  find:{title:'Suchen',icon:'find',run:()=>findApp()},
  update:{title:'Software-Update',icon:'update',run:()=>updateApp()},
  taskman:{title:'Anwendung schließen',icon:'exe',run:()=>taskmanApp()},
  crashy:{title:'Uraltspiel',icon:'exe',run:()=>crashyApp()},
  scandisk:{title:'ScanDisk',icon:'hdd',run:()=>scandiskApp()},
  dialup:{title:'DFÜ-Netzwerk',icon:'dialup',run:()=>Dialup.status()},
  bsod:{title:'Absturz',icon:'err',run:()=>Power.bsod()}
};
function launch(id,arg){
  const a=APPS[id];
  if(!a){ msgBox({title:'Fehler',text:`Das Programm "${id}" wurde nicht gefunden.`,icon:'err'}); return null; }
  Sound.unlock(); Menu.closeAll();
  try{ return a.run(arg); }
  catch(e){ console.error(e); msgBox({title:a.title,text:'Dieses Programm hat eine ungültige Aktion durchgeführt und wird geschlossen.\n\nWenden Sie sich an den Hersteller, wenn das Problem weiterhin besteht.',icon:'err',details:String(e&&e.stack||e)}); return null; }
}
function main(){
  FS.init(); Tip.init(); Menu.init();
  document.body.append(h('div',{id:'cheatpx'}));
  Theme.apply(); Desk.init(); Taskbar.init(); Wall.apply(); Saver.init();
  document.addEventListener('pointerdown',()=>{ Sound.unlock(); Tip.hide(); },true);
  document.addEventListener('contextmenu',e=>{ if(!e.target.closest('input,textarea')) e.preventDefault(); });
  document.addEventListener('keydown',e=>{
    if(Power.busy||Saver.el) return;
    if(e.ctrlKey&&e.altKey&&(e.key==='End'||e.key==='Delete')){ e.preventDefault(); if(WM.find('taskman')) Power.restart(); else launch('taskman'); return; }
    if(Menu.key(e)){ e.preventDefault(); return; }
    if(e.ctrlKey&&e.key==='Escape'){ e.preventDefault(); Taskbar.openStart(true); return; }
    const w=WM.active;
    if(w&&!w.closed){
      if(e.altKey&&e.key==='F4'){ e.preventDefault(); w.close(); return; }
      if(e.altKey&&!e.ctrlKey&&w.menubar&&e.key.length===1){ const k=e.key.toLowerCase(),i=w.menubar.spec.findIndex(m=>{ const mm=/&([^&])/.exec(m.label); return mm&&mm[1].toLowerCase()===k; }); if(i>=0){ e.preventDefault(); w.menubar.openAt(i,true); return; } }
      if(w.o.onKey&&w.o.onKey(e)){ e.preventDefault(); return; }
      if(e.key==='F1'&&!isTyping(e)){ e.preventDefault(); launch('help'); }
      return;
    }
    if(isTyping(e)) return;
    if(e.key==='F1'){ e.preventDefault(); launch('help'); return; }
    if(Desk.key(e)) e.preventDefault();
  });
  addEventListener('resize',()=>{ const r=WM.deskRect(); WM.wins.forEach(w=>{ if(w.maximized||w.closed||w.o.container) return; const L=w.el.offsetLeft,T=w.el.offsetTop; if(T>r.height-20) w.el.style.top=Math.max(0,r.height-40)+'px'; if(L>r.width-60) w.el.style.left=Math.max(0,r.width-w.el.offsetWidth)+'px'; w.o.onResize&&w.o.onResize(); }); });
  if(/[?&]test\b/.test(location.search)) window.__r98={launch,WM,FS,Desk,Taskbar,Power,Saver,Menu,Sound,Mail,Dialup,Theme,Wall,ICON,Explorer};
  Power.boot();
}
main();

})();
</script>
